services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: warp
      POSTGRES_USER: warp
      POSTGRES_PASSWORD: warp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount the script itself, not its directory. Mounting the directory
      # read-only and then mounting ./db *inside* it fails before Postgres
      # starts: Docker cannot create the nested mountpoint under a read-only
      # parent. Two siblings under the container's own directory work.
      - ./db/docker-entrypoint-initdb.d/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./db:/docker-entrypoint-initdb.d/db:ro

volumes:
  pgdata:
