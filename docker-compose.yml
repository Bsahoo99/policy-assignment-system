version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: warp
      POSTGRES_USER: warp
      POSTGRES_PASSWORD: warp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - ./db:/docker-entrypoint-initdb.d/db:ro

volumes:
  pgdata:
